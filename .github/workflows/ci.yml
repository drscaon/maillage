name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install "ruff==0.16.8"
      - run: ruff check .
      - run: ruff format --check .

  test:
    name: Tests (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          # one run on each other platform, on a recent Python
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        run: pytest
      - name: Command-line smoke test
        run: |
          maillage --version
          maillage list
          maillage generate --preset tea_towel --count 3 --vertices 400 --out ci-output
          maillage generate --preset tablecloth --count 2 --topology grid --vertices 300 --out ci-output
          python -m maillage.validate ci-output
          maillage preview ci-output/tea_towel

  blender:
    name: Blender drop test (bpy, Python 3.13)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: System libraries for the bpy module
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxrender1 libxxf86vm1 libxfixes3 libxi6 libxkbcommon0 libsm6 libgl1 libegl1
      - name: Install
        run: pip install -e ".[dev,blender]"
      - name: Blender tests
        run: pytest tests/test_blender.py -v
      - name: Drop test of every preset
        run: |
          status=0
          for preset in $(python -c "import maillage; print(' '.join(maillage.PRESETS))"); do
            maillage generate --preset "$preset" --count 2 --vertices 800 --out ci-output > /dev/null
            maillage drop-test "ci-output/$preset" --pieces 2 --frames 120 || status=1
          done
          exit $status
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: drop-test-reports
          path: ci-output/*/drop_test/drop_test.json
          retention-days: 14


  openusd:
    name: OpenUSD validators of every preset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e .
      - name: Generate every preset
        run: |
          for preset in $(python -c "from maillage.presets import PRESETS; print(' '.join(PRESETS))"); do
            maillage generate --preset "$preset" --count 2 --vertices 400 --out ci-usd > /dev/null
          done
      - name: Validate every file (what usdchecker runs)
        run: python -m maillage.validate ci-usd

  build:
    name: Build packages
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - name: Check package metadata
        run: twine check --strict dist/*
      - name: Install the wheel in a clean environment
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install dist/*.whl
          /tmp/venv/bin/maillage --version
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 14
