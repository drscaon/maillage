[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "maillage"
version = "0.1.0b2"
description = "Realistic textile assets generator for Physical AI: procedural cloth pieces (towels, napkins, sheets, flags) with real sizes, fabrics and patterns, exported to OpenUSD and validated by a cloth drop test in Blender."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Daniel Régis Sarmento Caon" }]
keywords = ["cloth", "textile", "simulation", "openusd", "blender", "procedural", "robotics", "physical-ai", "synthetic-data", "robot-learning", "primvaria"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "usd-core>=24.0",
]

[project.optional-dependencies]
render = ["matplotlib>=3.7", "pillow>=9"]
# Blender as a Python module: the bpy wheels exist for one Python version only
blender = ["bpy>=5.1; python_version == '3.13'"]
# MuJoCo drape test (maillage sim-test)
sim = ["mujoco>=3.2"]
dev = ["pytest>=7", "ruff>=0.5", "matplotlib>=3.7", "pillow>=9", "mujoco>=3.2"]

[project.urls]
Homepage = "https://github.com/drscaon/maillage"
Issues = "https://github.com/drscaon/maillage/issues"
Changelog = "https://github.com/drscaon/maillage/blob/main/CHANGELOG.md"
Suite = "https://github.com/drscaon/primvaria"

[project.scripts]
maillage = "maillage.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
