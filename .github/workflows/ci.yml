name: CI

# Two levels. On a commit (push to main, pull request): the fast tests (pytest -m "not
# slow") on Ubuntu and Python 3.12, and the engine checks on a sample of the presets
# (.github/ci_presets.py). Before a release (release.yml calls this workflow with
# full: true) and with the "Run workflow" button: every test on Linux, Windows and macOS
# and on every Python, the oldest OpenUSD, and the engine checks on every preset.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: Every test, platform and preset (as before a release)
        type: boolean
        default: true
  workflow_call:
    inputs:
      full:
        description: Every test, platform and preset
        type: boolean
        default: true

permissions:
  contents: read

env:
  FULL: ${{ inputs.full && 'true' || 'false' }}  # read by .github/ci_presets.py and the steps

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    # lint and format, tests on every Python and platform, oldest OpenUSD, package build:
    # the same in the four generators, written once in the primvaria repository
    uses: drscaon/primvaria/.github/workflows/generator-checks.yml@main
    with:
      full: ${{ inputs.full || false }}
      package: maillage
      smoke: |
        maillage --version
        maillage list
        maillage generate --preset tea_towel --count 3 --vertices 400 --out ci-output
        maillage generate --preset tablecloth --count 2 --topology grid --vertices 300 --out ci-output
        python -m maillage.validate ci-output
        maillage preview ci-output/tea_towel

  blender:
    name: Blender drop test (bpy, Python 3.13)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: System libraries for the bpy module
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxrender1 libxxf86vm1 libxfixes3 libxi6 libxkbcommon0 libsm6 libgl1 libegl1
      - name: Install
        run: pip install -e ".[dev,blender]"
      - name: Blender tests
        run: pytest tests/test_blender.py -v
      - name: Drop test of the presets
        run: |
          status=0
          for preset in $(python .github/ci_presets.py maillage); do
            maillage generate --preset "$preset" --count 2 --vertices 800 --out ci-output > /dev/null
            maillage drop-test "ci-output/$preset" --pieces 2 --frames 120 || status=1
          done
          exit $status
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: drop-test-reports
          path: ci-output/*/drop_test/drop_test.json
          retention-days: 14


  sim:
    name: MuJoCo drape test of the presets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[sim]"
      - name: Drape test of the presets
        run: |
          for preset in $(python .github/ci_presets.py maillage); do
            maillage generate --preset "$preset" --count 1 --vertices 400 --out ci-sim > /dev/null
          done
          maillage sim-test ci-sim/* --pieces 1
      - name: Fabrics do not drape alike (the same sample of every fabric)
        run: maillage fabric-test --out ci-sim/fabric_test
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sim-test-reports
          path: |
            ci-sim/*/sim_test/sim_test.json
            ci-sim/*/sim_test/mujoco_drape.xml
            ci-sim/fabric_test/fabric_test.json
          retention-days: 14

  openusd:
    name: OpenUSD validators of the presets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e .
      - name: Generate the presets
        run: |
          for preset in $(python .github/ci_presets.py maillage.presets); do
            maillage generate --preset "$preset" --count 2 --vertices 400 --out ci-usd > /dev/null
          done
      - name: Validate every file (what usdchecker runs), OmniPhysics layers included
        run: python -m maillage.validate ci-usd
      - name: Structure of the OmniPhysics layers
        run: python -m maillage.omniphysics ci-usd
      - name: Check every file against the Primvaria contract
        run: python -m maillage.conformance ci-usd
